<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const repo = '/a'; // tu repo
      const path = location.pathname.replace(repo, '');
      const query = location.search;
      const hash = location.hash;

      // Redirige a index.html con la ruta original como parámetro
      location.replace(
        repo + '/?redirect=' + encodeURIComponent(path + query + hash)
      );
    </script>
  </head>
  <body></body>
</html>
